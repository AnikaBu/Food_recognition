name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'food_flutter/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Doctor
        run: flutter doctor -v

      - name: Generate Android platform files
        working-directory: food_flutter
        run: |
          flutter create --platforms=android --org com.anikabu --project-name food_flutter .

      - name: Install Python image tools
        run: |
          python3 -m pip install pillow

      - name: Compute automated build version
        working-directory: food_flutter
        run: |
          MAJOR_MINOR=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'.' -f1,2)
          APP_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          TAG_NAME="v${APP_VERSION}"
          sed -i "s/^version:.*/version: ${APP_VERSION}+${{ github.run_number }}/" pubspec.yaml
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Automated build version: $APP_VERSION (Tag: $TAG_NAME, Run: ${{ github.run_number }})"

      - name: Configure Android permissions, icons and signing
        working-directory: food_flutter
        run: |
          python3 scripts/configure_android.py

      - name: Install Flutter dependencies
        working-directory: food_flutter
        run: |
          flutter pub get

      - name: Build Release APK
        working-directory: food_flutter
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK artifact
        working-directory: food_flutter
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/myfooddiary.apk

      - name: Verify APK Release Signature
        working-directory: food_flutter
        run: |
          python3 scripts/verify_apk_cert.py build/app/outputs/flutter-apk/myfooddiary.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfooddiary-apk
          path: food_flutter/build/app/outputs/flutter-apk/myfooddiary.apk
          if-no-files-found: error

      - name: Verify release version
        working-directory: food_flutter
        run: |
          echo "Verified release version: ${{ env.APP_VERSION }} (Tag: ${{ env.TAG_NAME }})"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "MyFoodDiary Android APK ${{ env.TAG_NAME }}"
          make_latest: true
          body: |
            ## 🥗 MyFoodDiary — Android App (Release APK ${{ env.TAG_NAME }})

            Персональное мобильное приложение для распознавания блюд и учета КБЖУ на базе искусственного интеллекта.

            ### Возможности:
            - 📸 **Съемка и выбор фото**: мгновенный снимок с камеры или выбор из галереи;
            - 🧠 **ИИ-анализ**: распознавание продуктов, ингредиентов и веса через Google Gemini Vision;
            - ⚖️ **Живой пересчет КБЖУ**: удобная регулировка веса (+/-10г или ручной ввод) с моментальным пересчетом питательных веществ;
            - 📅 **Дневник питания**: календарь по дням, диаграммы выполнения суточной нормы калорий, белков, жиров и углеводов;
            - 🎯 **Персистентность целей**: нормы КБЖУ синхронизируются с сервером и не сбрасываются;
            - 🔄 **Автообновление**: проверка новых версий и обновление прямо внутри приложения;
            - ⚙️ **Гибкое подключение**: переключение между домашней сетью Wi-Fi и облачным сервером Google Cloud.

            ### Инструкция по установке:
            1. Скачайте файл **`myfooddiary.apk`** ниже на свой Android-смартфон (или обновитесь внутри приложения).
            2. Откройте загруженный файл и подтвердите установку («Разрешить установку из неизвестных источников»).
            3. Запустите приложение и во вкладке **«Настройки»** укажите IP-адрес вашего компьютера (например, `http://192.168.1.100:8000`) или облачный URL.
          files: food_flutter/build/app/outputs/flutter-apk/myfooddiary.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

